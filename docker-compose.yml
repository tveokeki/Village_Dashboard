networks:
  n8n_default:
    external: true
services:
  suan-eak-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suan-eak-web
    env_file:
    - .env
    environment:
      DB_HOST: ${DB_HOST:-187.77.135.125}
      DB_NAME: ${DB_NAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://suan-ake.cloud}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://suan-ake.cloud}
      MAIL_FROM: ${MAIL_FROM:-Suan Ake Lake Park Villa <noreply@suan-ake.cloud>}
      MAIL_EHLO_NAME: ${MAIL_EHLO_NAME:-suan-ake.cloud}
      LINE_CLIENT_ID: ${LINE_CLIENT_ID:-1661205091}
      LINE_CLIENT_SECRET: ${LINE_CLIENT_SECRET:?LINE_CLIENT_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    expose:
    - '3000'
    volumes:
    - ./public/uploads:/app/public/uploads
    labels:
    - traefik.enable=true
    - traefik.http.routers.suan-ake.rule=Host(`suan-ake.cloud`)
    - traefik.http.routers.suan-ake.entrypoints=websecure
    - traefik.http.routers.suan-ake.tls.certresolver=mytlschallenge
    - traefik.http.services.suan-ake.loadbalancer.server.port=3000
    - traefik.docker.network=n8n_default
    - "traefik.http.middlewares.suan-akeweb-nocache.headers.customResponseHeaders.Cache-Control=no-store,no-cache,must-revalidate,max-age=0"
    - traefik.http.routers.suan-ake.middlewares=suan-akeweb-nocache
    networks:
    - n8n_default
    restart: unless-stopped
version: '3.8'
